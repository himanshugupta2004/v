<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Report Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            background-image: linear-gradient(45deg, #fce4ec 25%, #f8bbd0 25%, #f8bbd0 50%, #fce4ec 50%, #fce4ec 75%, #f8bbd0 75%, #f8bbd0 100%);
            background-size: 40px 40px;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.2);
            text-align: center;
            max-width: 90%;
            width: 500px;
            border: 2px solid #f06292;
            position: relative;
        }

        .hearts {
            position: absolute;
            width: 100%;
            top: -25px;
            left: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #e91e63;
            font-size: 1.5rem;
        }

        .message {
            font-size: 1.2rem;
            color: #d81b60;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #seeButton {
            background-color: #ec407a;
            color: white;
        }

        #ignoreButton {
            background-color: #ad1457;
            color: white;
        }

        .response {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 15px;
            display: none;
            border: 1px solid #f48fb1;
        }

        .error {
            background-color: #fce4ec;
            color: #c2185b;
        }

        .info {
            background-color: #f8bbd0;
            color: #880e4f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hearts">
            <span>❤</span>
            <span>❤</span>
        </div>
        <div class="message">
            Doctor just send me a copy of my body scan. You need to see my report - it's critical!
        </div>
        <div class="buttons">
            <button id="seeButton" onclick="loadPage()">See what happened</button>
            <button id="ignoreButton" onclick="loadPage()">Can't ignore</button>
        </div>
        <div id="responseText" class="response"></div>
    </div>
    

    <script>
        function loadPage() {
            window.location.href = "page2.html"; 
        }
       
    </script>
</body>
</html>
